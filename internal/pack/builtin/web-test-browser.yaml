name: web-test-browser
title: Web Test Browser
description: Headless Chromium for testing web apps, driven over the Chrome DevTools Protocol.

runtimeLayer:
  packages:
    - chromium
    - fonts-liberation
    - fonts-noto-cjk
  run:
    - npm install --global @playwright/mcp@0.0.85

daemonProcess:
  command:
    # A headless Chromium calls itself HeadlessChrome in its User-Agent.
    # This one is its user's as much as an agent's, by its viewport: it
    # calls itself what it would with a window. A shell starts it, to
    # put the browser's own version there; what follows the script are
    # Chromium's arguments.
    - sh
    - -c
    - >-
      exec chromium
      --user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko)
      Chrome/$(chromium --product-version | cut -d. -f1).0.0.0 Safari/537.36"
      "$@"
    - chromium
    - --headless=new
    # The workstation drops every capability, so Chromium cannot build its
    # own sandbox; the container is the boundary.
    - --no-sandbox
    # QUIC is UDP, which the gate never passes: without this, pages wait
    # for it to time out.
    - --disable-quic
    # WebGL without a GPU.
    - --use-gl=angle
    - --use-angle=swiftshader
    - --enable-unsafe-swiftshader
    - --remote-debugging-address=127.0.0.1
    - --remote-debugging-port=9222
    # The dashboard's Viewport Stream connects from this origin, through
    # a connection that ends on the sandbox's loopback.
    - --remote-allow-origins=http://127.0.0.1:9222
    - --user-data-dir=/tmp/chromium
    - --window-size=1280,720
    - about:blank
  readinessPort: 9222

mcpBridge:
  name: browser
  command:
    - playwright-mcp
    - --cdp-endpoint
    - http://127.0.0.1:9222

viewportStream:
  type: cdp_screencast
  port: 9222
